name: Weekly Issue Suggestions

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:     # Also allows manual trigger

jobs:
  suggest-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            You are a senior engineer reviewing this expense tracker codebase.
            Analyze the code in lib/, app/, and components/ directories.

            Look for:
            - Missing test coverage for complex logic
            - Potential bugs or edge cases not handled
            - Performance improvements (e.g. unnecessary re-fetches, large bundle)
            - UX improvements that would be high-value / low-effort
            - Security concerns

            Create 2-3 actionable GitHub issues using `gh issue create`.
            Each issue should:
            - Have a clear, specific title
            - Include a short description of the problem
            - Include acceptance criteria as a checklist
            - Be labeled appropriately (bug, enhancement, test, etc.)

            Only create issues for things that are clearly worth fixing.
            Do not create vague or overly broad issues.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
