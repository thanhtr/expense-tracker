name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
          .next
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    - name: Type check
      run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    # PRs only — changes merged to main already passed unit tests on their PR.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run unit tests
      run: npm test
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-report
        path: coverage/

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run database migrations
      # Neon's pooled URL (contains -pooler.) goes through PgBouncer which doesn't
      # support session-level advisory locks. Strip -pooler from the hostname to get
      # a direct connection for the migration step only.
      run: |
        DIRECT_URL="${DATABASE_URL/-pooler/}"
        DATABASE_URL="$DIRECT_URL" npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Seed built-in bank profiles
      run: npx prisma db seed
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Deploy to Vercel
      run: npx vercel deploy --prod --yes
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  e2e-test:
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-e2e')

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Hardcoded test-only secret — production value lives in Vercel env vars
        AUTH_SECRET: e2e-test-secret-not-used-in-production-must-be-at-least-32-chars

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Install Playwright system deps (cached)
      run: npx playwright install-deps chromium
      if: steps.playwright-cache.outputs.cache-hit == 'true'

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        CI: 'true'
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Hardcoded test-only credentials — production values live in Vercel env vars
        AUTH_SECRET: e2e-test-secret-not-used-in-production-must-be-at-least-32-chars
        AUTH_PASSWORD: testpassword

    - name: Upload Playwright report
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
