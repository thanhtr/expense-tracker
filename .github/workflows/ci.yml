name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache npm packages and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
          .next
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
        SPLITWISE_USER_ID: ${{ secrets.SPLITWISE_USER_ID }}
        SPLITWISE_WIFE_ID: ${{ secrets.SPLITWISE_WIFE_ID }}
        SPLITWISE_GROUP_ID: ${{ secrets.SPLITWISE_GROUP_ID }}

    - name: Type check
      run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test
      env:
        SPLITWISE_API_KEY: test-key
        SPLITWISE_USER_ID: '123'
        SPLITWISE_WIFE_ID: '456'
        SPLITWISE_GROUP_ID: '789'

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/

  e2e-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        SPLITWISE_API_KEY: test-key
        SPLITWISE_USER_ID: '123'
        SPLITWISE_WIFE_ID: '456'
        SPLITWISE_GROUP_ID: '789'

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build, unit-test, e2e-test]
    if: false  # Disabled for now - only deploy to production on main merge

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set Vercel environment variables
      run: |
        npx vercel env add NEXT_PUBLIC_SPLITWISE_API_KEY "${{ secrets.SPLITWISE_API_KEY }}" --token "${{ secrets.VERCEL_TOKEN }}" --project-id "${{ secrets.VERCEL_PROJECT_ID }}" --org-id "${{ secrets.VERCEL_ORG_ID }}" --environment preview --confirm || true
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    - name: Deploy preview to Vercel
      uses: vercel/action@v4
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-token: ${{ github.token }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, unit-test, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set Vercel environment variables
      run: |
        npx vercel env add NEXT_PUBLIC_SPLITWISE_API_KEY "${{ secrets.SPLITWISE_API_KEY }}" --token "${{ secrets.VERCEL_TOKEN }}" --project-id "${{ secrets.VERCEL_PROJECT_ID }}" --org-id "${{ secrets.VERCEL_ORG_ID }}" --environment production --confirm || true
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    - name: Deploy to Vercel
      if: success()
      uses: vercel/action@v4
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'

    - name: Comment on commit
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: '✅ Deployed to production: https://${{ secrets.VERCEL_URL }}'
          })
