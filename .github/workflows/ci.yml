name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
          .next
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    - name: Type check
      run: npx tsc --noEmit

    # Upload the Next.js build output as an artifact so the deploy job can
    # reuse the webpack cache and skip re-building on Vercel's servers.
    - name: Upload Next.js build artifact
      uses: actions/upload-artifact@v6
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      with:
        name: nextjs-build
        path: .next/
        retention-days: 1
        include-hidden-files: true

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    # PRs only — changes merged to main already passed unit tests on their PR.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run unit tests
      run: npm test
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-report
        path: coverage/

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    # Reuse node_modules cached by the build job — saves npm ci time on cache hit.
    - name: Restore node modules cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        PRISMA_MIGRATE_ADVISORY_LOCKING: '0'

    # Download the pre-built .next output from the build job.
    # vercel build reuses .next/cache so the Next.js compilation is fast.
    # continue-on-error: artifact may be absent on the first run or if upload
    # failed; vercel build will rebuild from scratch in that case.
    - name: Download Next.js build artifact
      uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        name: nextjs-build
        path: .next/

    - name: Pull Vercel project settings
      run: npx vercel pull --yes --environment=production
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # Build into .vercel/output using the cached .next (fast — webpack cache hits).
    # vercel deploy --prebuilt then uploads that output directly, skipping
    # a second full build on Vercel's servers.
    - name: Package for Vercel (prebuilt)
      run: npx vercel build --prod
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    - name: Deploy to Vercel (prebuilt)
      run: npx vercel deploy --prebuilt --prod
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  e2e-test:
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Hardcoded test-only secret — production value lives in Vercel env vars
        AUTH_SECRET: e2e-test-secret-not-used-in-production-must-be-at-least-32-chars

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Install Playwright system deps (cached)
      run: npx playwright install-deps chromium
      if: steps.playwright-cache.outputs.cache-hit == 'true'

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        CI: 'true'
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Hardcoded test-only credentials — production values live in Vercel env vars
        AUTH_SECRET: e2e-test-secret-not-used-in-production-must-be-at-least-32-chars
        AUTH_PASSWORD: testpassword

    - name: Upload Playwright report
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
