name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
          .next
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
        SPLITWISE_USER_ID: ${{ secrets.SPLITWISE_USER_ID }}
        SPLITWISE_WIFE_ID: ${{ secrets.SPLITWISE_WIFE_ID }}
        SPLITWISE_GROUP_ID: ${{ secrets.SPLITWISE_GROUP_ID }}

    - name: Type check
      run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test
      env:
        SPLITWISE_API_KEY: test-key
        SPLITWISE_USER_ID: '123'
        SPLITWISE_WIFE_ID: '456'
        SPLITWISE_GROUP_ID: '789'

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-report
        path: coverage/

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, unit-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create .env.production for Vercel deployment
      run: |
        cat > .env.production.local << 'EOF'
        SPLITWISE_API_KEY=${{ secrets.SPLITWISE_API_KEY }}
        SPLITWISE_USER_ID=${{ secrets.SPLITWISE_USER_ID }}
        SPLITWISE_WIFE_ID=${{ secrets.SPLITWISE_WIFE_ID }}
        SPLITWISE_GROUP_ID=${{ secrets.SPLITWISE_GROUP_ID }}
        EOF

    - name: Deploy to Vercel
      run: npx vercel --prod --yes --env-file .env.production.local
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  e2e-test:
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache npm packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        SPLITWISE_API_KEY: test-key
        SPLITWISE_USER_ID: '123'
        SPLITWISE_WIFE_ID: '456'
        SPLITWISE_GROUP_ID: '789'

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        CI: 'true'
        SPLITWISE_API_KEY: test-key
        SPLITWISE_USER_ID: '123'
        SPLITWISE_WIFE_ID: '456'
        SPLITWISE_GROUP_ID: '789'

    - name: Upload Playwright report
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
