name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            You are a senior engineer reviewing a pull request.
            The PR is titled: "${{ github.event.pull_request.title }}"
            The PR description: "${{ github.event.pull_request.body }}"

            Your job:
            1. Review the code changes for correctness, clarity, and best practices
            2. Check for: bugs, security issues, performance problems, missing tests
            3. Ensure the code matches the project architecture (see CLAUDE.md)
            4. Comment on specific issues using `gh pr review` with the `--comment` flag
            5. Do NOT approve or request changes — only provide constructive feedback

            Focus on:
            - Does it solve the problem stated in the PR?
            - Are there any obvious bugs?
            - Are tests needed?
            - Does it follow the project's patterns?
            - Any security concerns?

            If there are no issues, add a brief positive comment acknowledging the PR is well done.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
